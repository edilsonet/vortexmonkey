name: VORTEX CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: docker compose config -q
      - run: pnpm audit --prod --audit-level high

  system:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build
      - name: Seed efêmero
        run: |
          password="$(openssl rand -base64 24 | tr -d '\n')"
          printf '%s' "$password" > /tmp/vortex-test-password
          docker compose run --rm -e VORTEX_DEV_PASSWORD="$password" migrate pnpm db:seed:dev
      - run: node tools/e2e-phase2.mjs
      - run: docker compose run --rm migrate pnpm db:rls-test
      - name: Testes SQL de acesso e imutabilidade
        run: |
          docker compose exec -T postgres sh -ec 'export PGPASSWORD="$$(cat /run/vortex-secrets/postgres-admin)"; exec psql -v ON_ERROR_STOP=1 -U vortex_admin -d vortex' < tools/test-phase2-access.sql
          docker compose exec -T postgres sh -ec 'export PGPASSWORD="$$(cat /run/vortex-secrets/postgres-admin)"; exec psql -v ON_ERROR_STOP=1 -U vortex_admin -d vortex' < tools/test-phase2-immutability.sql
      - if: always()
        run: docker compose down -v
