# VORTEX v4 — variante de PRODUCAO (VPS/container host).
#
# Diferencas em relacao ao docker-compose.yml (desenvolvimento):
#   - `restart: always` em todos os servicos;
#   - Redis com `--requirepass`;
#   - infraestrutura SEM portas publicadas (so a API expoe 3400);
#   - segredos obrigatorios vindos do ambiente/secret manager (sem defaults).
#
#   export DB_ADMIN_PASSWORD=... DB_APP_PASSWORD=... REDIS_PASSWORD=...
#   docker compose -f docker-compose.prod.yml up -d --build
name: vortex-prod

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-vortex}
      POSTGRES_USER: ${DB_ADMIN_USER:-vortex_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?defina DB_ADMIN_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_ADMIN_USER:-vortex_admin} -d ${DB_NAME:-vortex}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?defina REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vortex}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: docker.io/minio/minio
    restart: always
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      # Aceita as duas formas de sonda do MinIO: `mc ready local` quando o
      # cliente esta na imagem, e o endpoint HTTP de saude caso contrario.
      test: ['CMD-SHELL', 'mc ready local 2>/dev/null || curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    image: vortex-ops-mro:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3400
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vortex}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-vortex_admin}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?defina DB_ADMIN_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-vortex_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?defina DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      AUTH_ALLOW_HEADER_CONTEXT: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vortex}:${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD}@rabbitmq:5672
      LEDGER_PRIVATE_KEY_FILE: /run/secrets/ledger_ed25519.pem
      LEDGER_PUBLIC_KEY_FILE: /run/secrets/ledger_ed25519.pub
      SEED_ON_BOOT: 'false'
      # Bootstrap do administrador (primeiro acesso). Rode uma vez com
      # BOOTSTRAP_ON_BOOT=true e depois volte para 'false'.
      BOOTSTRAP_ON_BOOT: ${BOOTSTRAP_ON_BOOT:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_CPF: ${ADMIN_CPF:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TENANT_NAME: ${TENANT_NAME:-}
      TENANT_TYPE: ${TENANT_TYPE:-MANUTENCAO}
      COMPANY_CNPJ: ${COMPANY_CNPJ:-}
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_TRADE_NAME: ${COMPANY_TRADE_NAME:-}
      BOOTSTRAP_RESET_PASSWORD: ${BOOTSTRAP_RESET_PASSWORD:-false}
    ports:
      - '${API_PORT:-3400}:3400'
    secrets:
      - ledger_ed25519.pem
      - ledger_ed25519.pub
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3400/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    image: vortex-mro-web:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
    restart: always
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

secrets:
  ledger_ed25519.pem:
    file: ${LEDGER_PRIVATE_KEY_FILE:-./.secrets/ledger_ed25519.pem}
  ledger_ed25519.pub:
    file: ${LEDGER_PUBLIC_KEY_FILE:-./.secrets/ledger_ed25519.pub}

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
