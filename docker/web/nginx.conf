# VORTEX v4 — servidor web do ERP Manutencao (mro-web standalone).
#
# Este arquivo e incluido dentro do bloco `http` do nginx.conf padrao, entao as
# diretivas abaixo estao no contexto de `http`.

# Module Federation entrega `remoteEntry.mjs`; o mime.types do nginx nao cobre
# `.mjs`. Mapear evita que o navegador recuse o modulo por content-type errado.
types {
    text/javascript mjs;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: mesmo origem, proxy para o servico `api` do compose. Sem barra final
    # no proxy_pass para preservar o prefixo `/api` da requisicao original.
    location /api/ {
        proxy_pass http://api:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets com hash no nome: cache longo e imutavel.
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: o roteador do Angular resolve as rotas; tudo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
