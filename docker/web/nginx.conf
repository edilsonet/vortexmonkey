# VORTEX v4 — servidor web do ERP Manutencao (mro-web standalone).
#
# Este arquivo e incluido dentro do bloco `http` do nginx.conf padrao, entao as
# diretivas abaixo estao no contexto de `http`.

# Module Federation entrega `remoteEntry.mjs`; o mime.types do nginx nao cobre
# `.mjs`. Mapear evita que o navegador recuse o modulo por content-type errado.
types {
    text/javascript mjs;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

# Rate limit de borda (a API tambem limita por IP/Redis; este e a primeira
# barreira, antes de a requisicao consumir um worker da API). 10r/s por IP com
# rajada curta: navegacao normal nao sente; forca bruta e varredura sentem.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;

# O WebSocket exige o cabecalho Connection: upgrade trocado no proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: mesmo origem, proxy para o servico `api` do compose. Sem barra final
    # no proxy_pass para preservar o prefixo `/api` da requisicao original.
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;
        # 429 no formato do envelope global, para o cliente nao receber HTML.
        error_page 429 = @rate_limited;

        proxy_pass http://api:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade para o socket.io da Central de Comunicacao (`/api/socket.io`).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Conexao ociosa do WebSocket: sem isso o proxy corta o socket em 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"success":false,"data":null,"error":{"code":"RATE_LIMITED","message":"Muitas requisicoes. Tente novamente em instantes."}}';
    }

    # Assets com hash no nome: cache longo e imutavel.
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: o roteador do Angular resolve as rotas; tudo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
