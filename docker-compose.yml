# VORTEX v4 — infraestrutura local + API `ops-mro`.
#
#   cp .env.example .env   # ajuste os segredos
#   docker compose up -d --build
#   curl http://localhost:3400/api/health
#
# A API aplica as migracoes no boot (idempotente) e depende de PostgreSQL e
# Redis saudaveis. Em producao os mesmos servicos sao provisionados pelo
# ambiente; as credenciais vem de secret manager.
name: vortex

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vortex}
      POSTGRES_USER: ${DB_ADMIN_USER:-vortex_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-troque-este-valor}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_ADMIN_USER:-vortex_admin} -d ${DB_NAME:-vortex}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vortex}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-troque-este-valor}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: docker.io/minio/minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vortex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque-este-valor}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data

  api:
    image: vortex-ops-mro:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3400
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vortex}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-vortex_admin}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-troque-este-valor}
      DB_APP_USER: ${DB_APP_USER:-vortex_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-troque-este-valor}
      JWT_SECRET: ${JWT_SECRET:-troque-este-valor}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      # Conveniencia de desenvolvimento: permite x-user-id/x-tenant-id sem login.
      AUTH_ALLOW_HEADER_CONTEXT: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vortex}:${RABBITMQ_PASSWORD:-troque-este-valor}@rabbitmq:5672
      # Chave Ed25519 do ledger persistida em volume; gerada no primeiro boot.
      LEDGER_PRIVATE_KEY_FILE: /app/.data/ledger-ed25519.pem
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      # Bootstrap do administrador (opcional; ver docker-compose.prod.yml).
      BOOTSTRAP_ON_BOOT: ${BOOTSTRAP_ON_BOOT:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_CPF: ${ADMIN_CPF:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TENANT_NAME: ${TENANT_NAME:-}
      TENANT_TYPE: ${TENANT_TYPE:-MANUTENCAO}
      COMPANY_CNPJ: ${COMPANY_CNPJ:-}
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_TRADE_NAME: ${COMPANY_TRADE_NAME:-}
      BOOTSTRAP_RESET_PASSWORD: ${BOOTSTRAP_RESET_PASSWORD:-false}
    ports:
      - '${API_PORT:-3400}:3400'
    volumes:
      - ledger-key:/app/.data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3400/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ledger-key:
